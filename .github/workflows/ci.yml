name: Morning CI

on:
  push:
    branches: [main, implementation/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: morning
          POSTGRES_USER: morning
          POSTGRES_PASSWORD: morning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morning -d morning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MORNING_ENV: test
      MORNING_DATABASE_URL: postgresql+psycopg://morning:morning@localhost:5432/morning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check backend tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: test -f dist/manifest.webmanifest && test -f dist/sw.js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.backend -t morning-api:ci .
      - run: docker build -f Dockerfile.web -t morning-web:ci .

  rollout:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: morning
      POSTGRES_USER: morning
      POSTGRES_PASSWORD: Morning-Smoke-Db-123!
      MORNING_ENV: test
      MORNING_SESSION_SECRET: Morning-Smoke-Session-Secret-Change-Me
      MORNING_PORT: 8080
      MORNING_BASE_URL: http://127.0.0.1:8080
      MORNING_SMOKE_ADMIN_USERNAME: smoke-admin
      MORNING_SMOKE_ADMIN_PASSWORD: Morning-Smoke-Admin-123!
      MORNING_SMOKE_SUPERVISOR_PASSWORD: Morning-Smoke-Supervisor-123!
      MORNING_SMOKE_ALLOW_MUTATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "httpx>=0.28,<1"
      - run: docker compose up -d --build
      - name: Wait for Morning readiness
        run: python -c "from scripts.rollout_smoke import wait_ready; wait_ready()"
      - name: Bootstrap smoke admin
        run: printf '%s\n' "$MORNING_SMOKE_ADMIN_PASSWORD" | docker compose exec -T api morning bootstrap-admin --username "$MORNING_SMOKE_ADMIN_USERNAME" --display-name "Smoke Admin" --password-stdin
      - name: Walk supervisor-to-management flow
        run: python scripts/rollout_smoke.py
      - name: Verify backup and restore
        shell: bash
        run: |
          set -euo pipefail
          export MORNING_BACKUP_DIR="$RUNNER_TEMP/morning-backups"
          BACKUP="$(scripts/compose-backup.sh)"
          BEFORE="$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'SELECT count(*) FROM morning_crews')"
          docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c "INSERT INTO morning_crews (id, name) VALUES ('restore-sentinel', 'Restore Sentinel')"
          MUTATED="$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'SELECT count(*) FROM morning_crews')"
          test "$MUTATED" -eq "$((BEFORE + 1))"
          scripts/compose-restore.sh "$BACKUP"
          AFTER="$(docker compose exec -T db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc 'SELECT count(*) FROM morning_crews')"
          test "$AFTER" -eq "$BEFORE"
      - name: Show compose logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down rollout stack
        if: always()
        run: docker compose down -v
