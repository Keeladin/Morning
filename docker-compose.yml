services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-morning}
      POSTGRES_USER: ${POSTGRES_USER:-morning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - morning_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-morning} -d ${POSTGRES_DB:-morning}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      MORNING_ENV: ${MORNING_ENV:-development}
      MORNING_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-morning}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-morning}
      MORNING_SESSION_SECRET: ${MORNING_SESSION_SECRET:?set MORNING_SESSION_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)); assert data.get('application_ready') is True"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s


  atlas-export:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["morning", "atlas-export-runner"]
    environment:
      MORNING_ENV: ${MORNING_ENV:-development}
      MORNING_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-morning}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-morning}
      MORNING_SESSION_SECRET: ${MORNING_SESSION_SECRET:?set MORNING_SESSION_SECRET in .env}
      MORNING_ATLAS_EXPORT_DIR: /exports
      MORNING_ATLAS_EXPORT_LOOKBACK_WEEKS: ${MORNING_ATLAS_EXPORT_LOOKBACK_WEEKS:-4}
      MORNING_ATLAS_EXPORT_POLL_SECONDS: ${MORNING_ATLAS_EXPORT_POLL_SECONDS:-900}
    volumes:
      - ${MORNING_ATLAS_EXPORT_HOST_DIR:-/home/jaco/Workspace/Morning/Atlas}:/exports
    depends_on:
      api:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "${MORNING_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  morning_postgres:
